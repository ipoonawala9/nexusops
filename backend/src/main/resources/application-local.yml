spring:
  datasource:
    password: ${DB_APP_PASSWORD:nexusops_app_local}
  flyway:
    password: ${DB_OWNER_PASSWORD:nexusops_owner_local}

# 8080 is commonly taken on dev machines; containers override with SERVER_PORT=8080.
server:
  port: ${SERVER_PORT:8081}

nexusops:
  security:
    jwt:
      ephemeral-keys: true
  platform:
    # Local only — NOT a secret. Production must set PLATFORM_TOTP_KEY (32 random bytes, base64).
    totp-key: ${PLATFORM_TOTP_KEY:bG9jYWwtb25seS10b3RwLWtleS0zMi1ieXRlcyEhISE=}
