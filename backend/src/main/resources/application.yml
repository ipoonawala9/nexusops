spring:
  application:
    name: nexusops
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexusops}
    username: ${DB_APP_USER:nexusops_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_OWNER_USER:nexusops_owner}
    password: ${DB_OWNER_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    problemdetails:
      enabled: true

nexusops:
  mail:
    from: "NexusOps <no-reply@nexusops.local>"
  security:
    jwt:
      issuer: nexusops
      audience: nexusops-tenant
      access-token-ttl: 15m
      refresh-token-ttl: 14d
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      ephemeral-keys: false

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
