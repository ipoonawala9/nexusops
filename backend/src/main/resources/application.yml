spring:
  application:
    name: nexusops
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexusops}
    username: ${DB_APP_USER:nexusops_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_OWNER_USER:nexusops_owner}
    password: ${DB_OWNER_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 500ms
      connect-timeout: 500ms
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  task:
    execution:
      mode: force
  mvc:
    problemdetails:
      enabled: true

nexusops:
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: "NexusOps <no-reply@nexusops.local>"
    async: true
  security:
    jwt:
      issuer: nexusops
      audience: nexusops-tenant
      access-token-ttl: 15m
      refresh-token-ttl: 14d
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      ephemeral-keys: false
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  platform:
    audience: nexusops-platform
    access-token-ttl: 15m
    session-max-age: 8h
    totp-issuer: NexusOps
    totp-key: ${PLATFORM_TOTP_KEY:}

  rate-limits:
    rules:
      login: { capacity: 10, window: 1m }
      login-account: { capacity: 10, window: 1m }
      login-workspace: { capacity: 100, window: 1m }
      signup: { capacity: 5, window: 1m }
      verify-email: { capacity: 5, window: 1m }
      resend-verification: { capacity: 5, window: 1m }
      password-reset-request: { capacity: 5, window: 1m }
      password-reset-account: { capacity: 3, window: 15m }
      password-reset: { capacity: 10, window: 1m }
      invitation-accept: { capacity: 5, window: 1m }
      invitation-preview: { capacity: 20, window: 1m }
      refresh: { capacity: 30, window: 1m }
      platform-login: { capacity: 10, window: 1m }
      platform-login-account: { capacity: 5, window: 1m }
      api: { capacity: 300, window: 1m }

server:
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Mail is non-critical (sent after commit, failures only logged); an SMTP
    # outage must not make the service report DOWN / 503 and get pulled by the LB.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
