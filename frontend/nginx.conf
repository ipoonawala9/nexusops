# Access log without query strings: emailed invitation and verification tokens travel as ?token=… (the page URL and
# GET /api/v1/invitations/preview), and must not land in logs. $uri can't be used: try_files rewrites it to
# /index.html for every SPA route, so log the original path, cut at the first '?'.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
    default          "-";
}
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log no_query;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # If a load balancer/CDN is ever put in front of nginx, use real_ip_header/set_real_ip_from here instead, or all clients collapse to the LB IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
