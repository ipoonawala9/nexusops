name: nexusops

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nexusops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      NEXUSOPS_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-nexusops_owner_local}
      NEXUSOPS_APP_PASSWORD: ${DB_APP_PASSWORD:-nexusops_app_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexusops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    profiles: [app]
    build: ../../backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/nexusops
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-nexusops_app_local}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-nexusops_owner_local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    profiles: [app]
    build: ../../frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on: [backend]

  ai-service:
    profiles: [app]
    build: ../../ai-service
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
